name: dart_husky
description: A pure-Dart CLI tool to manage Git hooks (pre-commit, commit-msg, pre-push) in any Dart or Flutter project. Similar to husky and lefthook.
version: 1.8.1
repository: https://github.com/moulibheemaneti/dart_husky
homepage: https://github.com/moulibheemaneti/dart_husky
issue_tracker: https://github.com/moulibheemaneti/dart_husky/issues

topics:
  - git-hooks
  - husky
  - cli
  - developer-tools
  - git

screenshots:
  - description: dart_husky logo
    path: doc/assets/logo.png

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.7.0
  yaml: ^3.1.4
  path: ^1.9.1
  glob: ^2.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
